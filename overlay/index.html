<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<meta name="robots" content="noindex, nofollow">
<title>Liebe Sensei stream overlay</title>
<!--
  ShadowStream browser-widget overlay (23 Nov 2026, PC 2).
  Paste into ShadowStream → Alerts → widget URL:
    https://liebesensei.github.io/overlay/?k=YOUR_API_KEY
  Options: &goal=250  &v=VIDEO_ID (force a stream)  &demo=1 (fake chat for testing)
           &se=STREAMELEMENTS_OVERLAY_URL (URL-encoded) shows StreamElements alerts (subscriber names) inside this page
  Chat commands (channel owner or moderators):
    !predict [seconds]  open WIN/LOSE voting (viewers type 1 or 2; default 180 s)
    !close              stop voting early
    !win / !lose        show whether chat was right
    !goal 300           change the subscriber goal for this stream
    !testsub            test: fake +1 subscriber (toast + chime); the next real check corrects it
    !countdown 5        start a 5-minute "starting soon" countdown now (chat reaches the page 30–50 s late)
    !start              hide the countdown immediately
    !label HAAT TRYOUTS set the gold label above the countdown (kept after reload); !label off = default
                        (default: "PEAK DAY N" until 28 Nov 2026, "RANKED • ROAD TO 120★" from 29 Nov)
    !queue next 4       call the next 1–4 players from the !join queue into the party (team code); !queue done clears it
  &sound=0 mutes the subscriber chime.
  Starting-soon countdown (added 24 Nov 2026, PC 1): shows automatically in the 30 minutes before 7:00 PM IST and
  disappears at 7:00 ("LIVE NOW"). &cd=19:30 changes the time (IST), &cd=0 turns it off, &day=0 hides "PEAK DAY N",
  &cdtest=90 forces a 90-second countdown for testing.
  The page is transparent and draws only small boxes, so the game stays visible.
-->
<style>
  :root { --gold:#ffc61a; --gold2:#ffdf6e; --ink:#fff; --void:rgba(8,8,16,.82); --cyan:#5fe3ff; --red:#ff3b55; --green:#2fe07a; }
  html, body { margin:0; background:transparent; overflow:hidden; }
  body { font-family:"Exo 2","Segoe UI",Roboto,"Noto Sans Malayalam","Nirmala UI",sans-serif; color:var(--ink); }
  #root { position:relative; width:1280px; }
  .box { position:absolute; background:var(--void); border-radius:12px; box-shadow:0 0 0 2px rgba(255,198,26,.55), 0 6px 18px rgba(0,0,0,.45); }

  /* subscriber goal */
  #goal { left:8px; padding:6px 10px 7px; width:236px; font-size:15px; font-weight:700; letter-spacing:.3px; }
  #goal .row { display:flex; justify-content:space-between; }
  #goal .bar { margin-top:5px; height:8px; border-radius:6px; background:rgba(255,255,255,.15); overflow:hidden; }
  #goal .fill { height:100%; width:0; background:linear-gradient(90deg,var(--gold),var(--gold2)); transition:width 1.2s ease; }

  /* chat */
  #chat { left:8px; width:300px; padding:8px 10px; display:flex; flex-direction:column; justify-content:flex-end; gap:5px; overflow:hidden; }
  #chat:empty { display:none; }
  .msg { font-size:17px; line-height:1.28; animation:in .35s ease both; overflow-wrap:anywhere; text-shadow:0 1px 2px #000; }
  .msg b { color:var(--gold); font-weight:700; }
  .msg.mod b { color:var(--cyan); }
  .msg.owner b { color:#ff8a3d; }
  .msg.old { opacity:.55; }
  @keyframes in { from { opacity:0; transform:translateX(-14px); } to { opacity:1; transform:none; } }

  /* prediction */
  #pred { left:8px; width:300px; padding:9px 12px 10px; display:none; }
  #pred.on { display:block; animation:in .35s ease both; }
  #pred .t { font-size:16px; font-weight:800; color:var(--gold); display:flex; justify-content:space-between; }
  #pred .q { font-size:14px; opacity:.85; margin:2px 0 6px; }
  #pred .bars { display:flex; height:26px; border-radius:7px; overflow:hidden; font-size:14px; font-weight:800; }
  #pred .w { background:var(--green); color:#03200e; display:flex; align-items:center; padding-left:8px; white-space:nowrap; transition:flex-grow .6s; }
  #pred .l { background:var(--red); color:#2a0008; display:flex; align-items:center; justify-content:flex-end; padding-right:8px; white-space:nowrap; transition:flex-grow .6s; }
  #pred .n { font-size:13px; opacity:.8; margin-top:5px; display:flex; justify-content:space-between; }
  #pred .res { font-size:20px; font-weight:900; text-align:center; margin-top:6px; display:none; }

  #playqueue { right:12px; top:190px; width:270px; padding:10px 12px; display:none; font-size:16px; }
  #playqueue.on { display:block; }
  #playqueue strong { color:var(--gold); }
  #playqueue .names { margin-top:6px; line-height:1.45; overflow-wrap:anywhere; }
  #playqueue .party { margin-top:7px; padding-top:6px; border-top:1px solid rgba(255,198,26,.45); color:var(--green); font-weight:800; line-height:1.4; overflow-wrap:anywhere; }
  .vert #playqueue { top:694px; right:40px; width:500px; font-size:28px; }   /* 28 Nov: moved up from 1050 px, it overlapped the chat box */
  .vert.qon #pred { width:620px !important; }   /* queue showing: prediction box takes the left half, queue the right */

  /* pop-ups */
  #pop { position:absolute; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  .toast { background:var(--void); border-radius:14px; padding:10px 22px 11px; text-align:center; box-shadow:0 0 0 2px var(--gold), 0 8px 26px rgba(0,0,0,.5); animation:pop .45s cubic-bezier(.2,1.4,.4,1) both; white-space:nowrap; }
  .toast .h { font-size:22px; font-weight:900; color:var(--gold); }
  .toast .s { font-size:16px; margin-top:2px; }
  .toast.sub { box-shadow:0 0 0 3px var(--red), 0 0 40px rgba(255,59,85,.6); padding:14px 34px; }
  .toast.sub .h { font-size:30px; color:#fff; }
  .toast.out { animation:out .4s ease both; }
  @keyframes pop { from { opacity:0; transform:scale(.6) translateY(-10px); } to { opacity:1; transform:none; } }
  @keyframes out { to { opacity:0; transform:translateY(-12px); } }

  /* starting-soon countdown */
  #cd { position:absolute; left:0; top:0; width:1280px; display:none; align-items:flex-start; justify-content:center; box-sizing:border-box; padding-top:118px; background:rgba(6,6,14,.62); }
  body:not(.vert).cdon #pop { top:8px !important; }   /* keep welcome pop-ups above the card */
  #cd.on { display:flex; animation:fade .6s ease both; }
  #cd.out { animation:fadeout .8s ease both; }
  #cd .card { text-align:center; padding:22px 54px 24px; border-radius:20px; background:var(--void); box-shadow:0 0 0 3px var(--gold), 0 0 60px rgba(255,198,26,.35); }
  #cd .day { font-size:22px; font-weight:900; letter-spacing:3px; color:#111; background:var(--gold); display:inline-block; padding:3px 14px; border-radius:6px; }
  #cd .lbl { font-size:30px; font-weight:900; letter-spacing:4px; margin-top:10px; }
  #cd .time { font-size:118px; font-weight:900; line-height:1; color:var(--gold); font-variant-numeric:tabular-nums; text-shadow:0 0 30px rgba(255,198,26,.45); margin:6px 0 4px; }
  #cd .ml { font-size:26px; font-weight:700; }
  #cd .hi { font-size:20px; opacity:.85; margin-top:6px; }
  #cd.go .time { font-size:84px; color:#fff; animation:pop .5s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes fadeout { to { opacity:0; } }
  /* vertical: the card sits in the game area at the top; the widgets below stay visible */
  .vert #cd { padding-top:28px; }
  .vert #cd .card { padding:24px 70px 28px; }
  .vert #cd .day { font-size:32px; } .vert #cd .lbl { font-size:42px; } .vert #cd .time { font-size:170px; }
  .vert #cd .ml { font-size:38px; } .vert #cd .hi { font-size:30px; } .vert #cd.go .time { font-size:120px; }

  #se { position:absolute; left:0; top:0; pointer-events:none; }
  #se iframe { border:0; background:transparent; transform-origin:0 0; }
  #status { position:absolute; right:8px; font-size:12px; opacity:.6; background:rgba(0,0,0,.5); padding:2px 6px; border-radius:6px; display:none; }
</style>
</head>
<body>
<div id="root">
  <div id="cd"><div class="card">
    <div class="day" id="cdday"></div>
    <div class="lbl" id="cdlbl">STARTING SOON</div>
    <div class="time" id="cdtime">0:00</div>
    <div class="ml" id="cdml">7 PM-ന് തുടങ്ങും 🔥</div>
    <div class="hi" id="cdhi">Chat-ൽ ഹായ് പറയൂ 👋 · Ask WHY anytime</div>
  </div></div>
  <div id="goal" class="box"><div class="row"><span>🎯 SUBSCRIBER GOAL</span><span id="gnum">–</span></div><div class="bar"><div class="fill" id="gfill"></div></div></div>
  <div id="pred" class="box">
    <div class="t"><span>🔮 PREDICT THE MATCH</span><span id="ptime"></span></div>
    <div class="q">Type <b>1</b> = WIN 🏆 &nbsp;·&nbsp; <b>2</b> = LOSE 💀</div>
    <div class="bars"><div class="w" id="pw">WIN 50%</div><div class="l" id="pl">50% LOSE</div></div>
    <div class="n"><span id="pn">0 votes</span><span id="pst">voting open</span></div>
    <div class="res" id="pres"></div>
  </div>
  <div id="playqueue" class="box"><strong id="queuehead"></strong><div class="names" id="queuenames"></div><div class="party" id="queueparty" style="display:none"></div></div>
  <div id="chat" class="box"></div>
  <div id="pop"></div>
  <div id="se"></div>
  <div id="status"></div>
</div>
<script>
(() => {
  'use strict';
  const P = new URLSearchParams(location.search);
  const KEY = P.get('k') || '';
  const CHANNEL = P.get('ch') || 'UCQwQP5w9J6kIuN7tw7f952A';
  const DEMO = P.get('demo') === '1' || P.get('demo') === '2';   // demo=2: no result typed (tests the auto-close)
  let goal = +P.get('goal') || 250;
  const SOUND = P.get('sound') !== '0';   // &sound=0 mutes the subscriber chime

  /* short two-note chime made in code (no audio file, no copyright) */
  let actx = null;
  function chime() {
    if (!SOUND) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const t0 = actx.currentTime + 0.02;
      [[1046.5, 0], [1568, 0.14], [2093, 0.28]].forEach(([f, d]) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t0 + d);
        g.gain.linearRampToValueAtTime(0.28, t0 + d + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0008, t0 + d + 0.55);
        o.connect(g).connect(actx.destination);
        o.start(t0 + d); o.stop(t0 + d + 0.6);
      });
    } catch (_) {}
  }
  const API = 'https://www.googleapis.com/youtube/v3/';
  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (_) { return d; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };
  const status = t => { const s = $('status'); s.textContent = t + (P.get('debug') === '1' ? (window.__se ? ' · SE on' : ' · SE off') : ''); s.style.display = (P.get('debug') === '1' || DEMO) ? 'block' : 'none'; if (P.get('debug') === '1') { s.style.fontSize = '20px'; s.style.opacity = '1'; s.style.top = '240px'; } };
  addEventListener('error', e => status('JS error: ' + (e.message || e.type)));
  addEventListener('unhandledrejection', e => status('JS error: ' + ((e.reason && e.reason.message) || e.reason)));

  /* ---------- layout: horizontal 1280×720 (game on top, ShadowStream panel 144 px at the bottom)
                 or vertical 1280×2276 (game on top, free middle, panel in the bottom 35%) ---------- */
  function layout() {
    const W = innerWidth || 1280, H = innerHeight || 720;
    const h = H * 1280 / W;                       // height in our 1280-wide CSS space
    $('root').style.height = h + 'px';
    const vertical = h > 1000;
    $('cd').style.height = (vertical ? 1280 / (20 / 9) + 8 : h - 144) + 'px';   // dim only the game area, not the app panel or widgets
    const g = $('goal').style, c = $('chat').style, p = $('pred').style, pop = $('pop').style, st = $('status').style;
    st.top = '6px';
    if (!vertical) {
      // under the minimap; chat + prediction in the grass area bottom-left, above the app panel
      const panelTop = h - 144;
      g.top = '190px';
      c.bottom = (h - panelTop + 6) + 'px'; c.top = 'auto'; c.maxHeight = "120px"; c.width = '300px';
      p.bottom = (h - panelTop + 6 + 156) + 'px'; p.top = 'auto';
      pop.top = '58px';
    } else {
      const gameBottom = 1280 / (20 / 9) + 8;     // ~584 for a 20:9 phone
      const panelTop = h * 0.65;
      const free = panelTop - gameBottom;
      g.top = (gameBottom + 14) + 'px'; g.left = '40px'; g.width = '1160px'; g.fontSize = '30px';
      document.querySelector('#goal .bar').style.height = '16px';
      p.top = (gameBottom + 110) + 'px'; p.left = '40px'; p.width = '1160px'; p.fontSize = '';
      $('pred').classList.add('big');
      c.top = (gameBottom + 430) + 'px'; c.bottom = 'auto'; c.left = '40px'; c.width = '1160px';
      c.maxHeight = '230px';
      pop.top = (gameBottom + 690) + 'px';
      document.body.classList.add('vert');
    }
  }
  const vcss = document.createElement('style');
  vcss.textContent = `.vert .msg{font-size:34px}.vert .toast .h{font-size:44px}.vert .toast .s{font-size:30px}.vert .toast.sub .h{font-size:56px}
    .vert #pred .t{font-size:32px}.vert #pred .q{font-size:28px}.vert #pred .bars{height:52px;font-size:28px}.vert #pred .n{font-size:24px}.vert #pred .res{font-size:40px}`;
  document.head.appendChild(vcss);
  addEventListener('resize', layout); layout();

  /* ---------- pop-ups (queued) ---------- */
  const queue = []; let showing = 0;
  function toast(h, s, cls = '', ms = 5000) { queue.push({ h, s, cls, ms }); pump(); }
  function pump() {
    const max = document.body.classList.contains('cdon') && !document.body.classList.contains('vert') ? 1 : 2;   // one at a time above the countdown card
    if (showing >= max || !queue.length) return;
    const t = queue.shift(); showing++;
    const el = document.createElement('div'); el.className = 'toast ' + t.cls;
    el.innerHTML = `<div class="h">${t.h}</div>${t.s ? `<div class="s">${t.s}</div>` : ''}`;
    $('pop').appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => { el.remove(); showing--; pump(); }, 400); }, t.ms);
  }

  /* ---------- chat ---------- */
  const seen = new Set(store.get('ls_seen', []));
  function chatLine(name, text, role) {
    const box = $('chat');
    const el = document.createElement('div'); el.className = 'msg ' + (role || '');
    el.innerHTML = `<b>${esc(String(name).replace(/^@/, ''))}</b> ${esc(text)}`;
    box.appendChild(el);
    while (box.children.length > 4) box.firstChild.remove();
    [...box.children].forEach((m, i, a) => m.classList.toggle("old", i < a.length - 2));
    clearTimeout(box._t); box.style.opacity = 1;
    box._t = setTimeout(() => { box.style.transition = 'opacity 1.5s'; box.style.opacity = 0; setTimeout(() => { box.innerHTML = ''; box.style.opacity = 1; box.style.transition = ''; }, 1600); }, 90000);
  }
  function handle(m) {
    const name = m.name.replace(/^@/, ''), text = (m.text || '').trim();
    const role = m.owner ? 'owner' : (m.mod ? 'mod' : '');
    const boss = m.owner || m.mod;
    if (/^!join$/i.test(text)) { queueJoin(m.id, name); return; }
    if (/^!leave$/i.test(text)) { queueLeave(m.id); return; }
    // "!predict 1" / "!predict 2" is a viewer (or mod) trying to vote, not a new prediction.
    const pv = text.match(/^!predict\s+([12])$/i);
    if (pv) { if (pred.open) vote(m.id, pv[1] === '1'); return; }
    // !label keeps the owner's capitals: "!label HAAT TRYOUTS" sets the countdown label, "!label off" goes back to the default.
    const lb = text.match(/^!label(?:\s+(.+))?$/i);
    if (boss && lb) { const v = (lb[1] || '').trim(); store.set('ls_cdlabel', /^(off|reset|default)?$/i.test(v) ? '' : v.slice(0, 40)); drawLabel(); return; }
    if (boss && text.startsWith('!')) return command(text.toLowerCase());
    if (pred.open && /^[12]$/.test(text)) { vote(m.id, text === '1'); return; }
    if (!m.owner && m.id && !seen.has(m.id)) {
      seen.add(m.id); store.set('ls_seen', [...seen].slice(-5000));
      toast(`👋 Welcome, ${esc(name)}!`, 'ആദ്യമായി വന്നതിന് നന്ദി · Ask WHY in chat!');
    }
    if (text) chatLine(name, text, role);
  }

  /* Play with Sensei: local to this browser, starts closed on reload. */
  // party = the players called in with "!queue next N" (up to 4: the user plus 4 = a full 5-player team code party)
  const playQueue = { open:false, visible:false, players:[], party:[] };
  function drawQueue() {
    $('playqueue').classList.toggle('on', playQueue.visible);
    document.body.classList.toggle('qon', playQueue.visible);
    $('queuehead').textContent = `PLAY WITH SENSEI · ${playQueue.open ? 'OPEN' : 'CLOSED'} (${playQueue.players.length})`;
    $('queuenames').textContent = playQueue.players.length ? playQueue.players.slice(0,5).map((p,i) => `${i+1}. ${p.name}`).join(' · ') : (playQueue.open ? 'Type !join to play' : 'Queue empty');
    $('queueparty').textContent = playQueue.party.length ? `IN THE PARTY: ${playQueue.party.join(' · ')}` : '';
    $('queueparty').style.display = playQueue.party.length ? '' : 'none';
  }
  let queueHideTimer = 0;
  function queueActivity() {
    clearTimeout(queueHideTimer);
    playQueue.visible = true; drawQueue();
    queueHideTimer = setTimeout(() => { playQueue.visible = false; drawQueue(); }, 30000);
  }
  function queueJoin(id, name) {
    if (!playQueue.open || !id || playQueue.players.some(p => p.id === id) || playQueue.players.length >= 100) return;
    playQueue.players.push({id, name: String(name).slice(0,40)}); queueActivity();
  }
  function queueLeave(id) { const before = playQueue.players.length; playQueue.players = playQueue.players.filter(p => p.id !== id); if (playQueue.players.length !== before) queueActivity(); }
  function queueCommand(arg, n) {
    if (arg === 'open') { playQueue.open = true; queueActivity(); }
    else if (arg === 'close') { playQueue.open = false; queueActivity(); }
    else if (arg === 'next') {                  // "!queue next" = 1 player, "!queue next 4" = up to 4 (team code party)
      const k = Math.min(4, Math.max(1, Math.floor(+n) || 1));
      if (playQueue.players.length) {
        const picked = playQueue.players.splice(0, k).map(p => p.name);
        playQueue.party = picked;
        toast(picked.length > 1 ? 'TEAM CODE: JOIN NOW' : 'NEXT PLAYER', esc(picked.join(' · ')));
        queueActivity();
      }
    }
    else if (arg === 'done') { playQueue.party = []; queueActivity(); }   // the party game is over
    else if (arg === 'reset') { clearTimeout(queueHideTimer); playQueue.open = false; playQueue.players = []; playQueue.party = []; playQueue.visible = false; drawQueue(); }
    else if (arg === 'show') queueActivity();
    else if (arg === 'hide') { clearTimeout(queueHideTimer); playQueue.visible = false; drawQueue(); }
  }
  /* ---------- prediction ---------- */
  const pred = { open: false, votes: new Map(), until: 0, timer: 0 };
  function command(t) {
    const [cmd, arg, arg2] = t.split(/\s+/);
    if (cmd === '!queue') queueCommand(arg, arg2);
    else if (cmd === '!predict' && !pred.open) openPred(Math.max(30, +arg || 180));   // never shorter than 30 s
    else if (cmd === '!close') closePred();
    else if (cmd === '!clear') { closePred(); clearTimeout(predHideT); pred.votes.clear(); $('pred').classList.remove('on'); }
    else if (cmd === '!win' || cmd === '!lose') resolvePred(cmd === '!win');
    else if (cmd === '!goal' && +arg > 0) { goal = +arg; drawGoal(); }
    else if (cmd === '!testsub' && subs != null) setSubs(subs + 1);   // test only: the next real check corrects the number
    else if (cmd === '!countdown') cdStart(Date.now() + (+arg > 0 ? +arg : 5) * 60000, true);
    else if (cmd === '!start') cdEnd(false);
  }

  /* ---------- starting-soon countdown (shows in the 30 min before 7:00 PM IST) ---------- */
  const IST = 5.5 * 3600000;
  const cdParam = P.get('cd');
  const cdOff = cdParam === '0';
  const [cdH, cdM] = /^\d{1,2}:\d{2}$/.test(cdParam || '') ? cdParam.split(':').map(Number) : [19, 0];
  const cd = { until: 0, timer: 0, manual: false, done: false };
  function istTarget() {                       // today's start time (IST) as a UTC timestamp
    const ist = new Date(Date.now() + IST);
    return Date.UTC(ist.getUTCFullYear(), ist.getUTCMonth(), ist.getUTCDate(), cdH, cdM) - IST;
  }
  function peakDay() {                         // Peak Day 1 = 20 Nov 2026 (IST)
    const d = Math.floor((Date.now() + IST - Date.UTC(2026, 10, 20)) / 86400000) + 1;
    return d >= 1 && d <= 400 ? d : 0;
  }
  // Gold label above "STARTING SOON" (28 Nov 2026, PC 1). Order: !label from chat (owner/mod, kept after reload)
  // > &label= in the URL > "PEAK DAY N" until 28 Nov > "RANKED • ROAD TO 120★" from 29 Nov (back to ranked). &day=0 hides it.
  function cdLabel() {
    if (P.get('day') === '0') return '';
    const chatLabel = store.get('ls_cdlabel', '');
    if (chatLabel) return chatLabel;
    if (P.get('label')) return P.get('label').slice(0, 40);
    if (Date.now() + IST < Date.UTC(2026, 10, 29)) { const d = peakDay(); return d ? `PEAK DAY ${d}` : ''; }
    return 'RANKED • ROAD TO 120★';
  }
  function drawLabel() { const l = cdLabel(); $('cdday').textContent = l; $('cdday').style.display = l ? '' : 'none'; }
  function cdStart(until, manual) {
    cd.until = until; cd.manual = manual; cd.done = false;
    drawLabel();
    $('cdlbl').textContent = 'STARTING SOON';
    const t = new Date(until + IST), hh = t.getUTCHours(), mm = t.getUTCMinutes();
    $('cdml').textContent = `${(hh % 12) || 12}${mm ? ':' + String(mm).padStart(2, '0') : ''} ${hh < 12 ? 'AM' : 'PM'}-ന് തുടങ്ങും 🔥`;
    $('cdhi').style.display = '';
    $('cd').classList.remove('go', 'out'); $('cd').classList.add('on'); document.body.classList.add('cdon');
    clearInterval(cd.timer); cd.timer = setInterval(cdTick, 250); cdTick();
  }
  function cdTick() {
    const s = Math.ceil((cd.until - Date.now()) / 1000);
    if (s <= 0) return cdEnd(true);
    $('cdtime').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }
  function cdEnd(showGo) {
    clearInterval(cd.timer); cd.done = true;
    const el = $('cd'); if (!el.classList.contains('on')) return;
    const hide = () => { el.classList.add('out'); setTimeout(() => { el.classList.remove('on', 'out', 'go'); document.body.classList.remove('cdon'); }, 800); };
    if (!showGo) return hide();
    el.classList.add('go'); $('cdlbl').textContent = "LET'S GO!"; $('cdtime').textContent = 'LIVE NOW 🔥';
    $('cdml').textContent = 'ഇനി തുടങ്ങാം! 🎮'; $('cdhi').style.display = 'none';
    setTimeout(hide, 4000);
  }
  function cdAuto() {                          // runs once on load and every 20 s
    if (cdOff || cd.manual || cd.done) return;
    const target = istTarget(), left = target - Date.now();
    if (left > 0 && left <= 30 * 60000 && !$('cd').classList.contains('on')) cdStart(target, false);
  }
  if (+P.get('cdtest') > 0) cdStart(Date.now() + P.get('cdtest') * 1000, true);
  else { cdAuto(); setInterval(cdAuto, 20000); }
  function openPred(sec) {
    clearTimeout(predHideT);   // a new prediction cancels any pending auto-close
    pred.open = true; pred.votes.clear(); pred.until = Date.now() + sec * 1000;
    $('pres').style.display = 'none'; $('pst').textContent = 'voting open';
    $('pred').classList.add('on'); drawPred();
    clearInterval(pred.timer);
    pred.timer = setInterval(() => { const s = Math.max(0, Math.round((pred.until - Date.now()) / 1000)); $('ptime').textContent = s ? `⏱ ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : ''; if (!s) closePred(); }, 500);
    toast('🔮 PREDICTION OPEN', 'Type 1 = WIN · 2 = LOSE', '', 4500);
  }
  // One hide timer for the box, so an old timer never closes a newer prediction.
  let predHideT = 0;
  function hidePredLater(ms) { clearTimeout(predHideT); predHideT = setTimeout(() => $('pred').classList.remove('on'), ms); }
  function closePred() {
    if (!pred.open) return;
    pred.open = false; clearInterval(pred.timer);
    $('ptime').textContent = '🔒'; $('pst').textContent = 'voting closed · waiting for result';
    hidePredLater(60000);   // auto-close the box 60 s after voting ends if no !win / !lose comes
  }
  function vote(id, win) { pred.votes.set(id || Math.random(), win); drawPred(); }
  function counts() { let w = 0, l = 0; pred.votes.forEach(v => v ? w++ : l++); return { w, l, n: w + l }; }
  function drawPred() {
    const { w, l, n } = counts(); const wp = n ? Math.round(w * 100 / n) : 50;
    $('pw').style.flexGrow = Math.max(wp, 12); $('pl').style.flexGrow = Math.max(100 - wp, 12);
    $('pw').textContent = `WIN ${wp}%`; $('pl').textContent = `${100 - wp}% LOSE`;
    $('pn').textContent = `${n} vote${n === 1 ? '' : 's'}`;
  }
  function resolvePred(win) {
    closePred();
    const { w, l, n } = counts();
    const chatSaid = w === l ? null : w > l;
    const r = $('pres'); r.style.display = 'block';
    $('pst').textContent = win ? 'RESULT: WIN 🏆' : 'RESULT: LOSE 💀';
    if (!n) r.textContent = 'No votes this time';
    else if (chatSaid === null) r.textContent = 'Chat was split 50/50 🤝';
    else r.innerHTML = chatSaid === win ? '<span style="color:var(--green)">Chat was RIGHT ✅</span>' : '<span style="color:var(--red)">Chat was WRONG ❌</span>';
    toast(win ? '🏆 WIN!' : '💀 LOSS', n ? (chatSaid === null ? 'Chat was split' : (chatSaid === win ? 'Chat was RIGHT ✅' : 'Chat was WRONG ❌')) : '', '', 6000);
    $('pred').classList.add('on');   // show the result even if the box had already auto-closed
    hidePredLater(15000);
  }

  /* ---------- subscriber goal ---------- */
  let subs = store.get('ls_subs', null);
  function drawGoal() {
    if (subs == null) return;
    $('gnum').textContent = `${subs} / ${goal}`;
    $('gfill').style.width = Math.min(100, subs * 100 / goal) + '%';
  }
  /* StreamElements alerts (named subscribers) embedded in this page; ShadowStream has only one widget slot */
  const SE = (() => { try { const u = new URL(P.get('se') || ''); return u.protocol === 'https:' && /(^|\.)streamelements\.com$/.test(u.hostname) ? u.href : ''; } catch (_) { return ''; } })();
  window.__se = !!SE;
  if (P.get('se') && !SE) window.__se = false, setTimeout(() => status('SE link not accepted (must start with https://streamelements.com/)'), 3000);
  if (SE) {
    const W = +P.get('sew') || 1920, H = +P.get('seh') || 1080, s = 1280 / W;
    const f = document.createElement('iframe');
    f.src = SE; f.width = W; f.height = H; f.style.transform = `scale(${s})`;
    f.setAttribute('allow', 'autoplay'); f.setAttribute('scrolling', 'no');
    $('se').appendChild(f);
  }
  function setSubs(n) {
    // With StreamElements on, it shows the big named alert; ours becomes a small counter toast so nothing doubles up.
    if (subs != null && n > subs) {
      chime();
      if (SE) toast('🎉 +1 subscriber', `${n} / ${goal}`, '', 4000);
      else toast('🎉 NEW SUBSCRIBER!', `Thank you! · ${n} / ${goal}`, 'sub', 6500);
    }
    subs = n; store.set('ls_subs', n); drawGoal();
  }
  drawGoal();

  /* ---------- YouTube Data API ---------- */
  async function api(path, params) {
    const u = new URL(API + path); Object.entries({ ...params, key: KEY }).forEach(([k, v]) => u.searchParams.set(k, v));
    const r = await fetch(u, { referrerPolicy: 'strict-origin-when-cross-origin' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error((j.error && j.error.errors && j.error.errors[0] && j.error.errors[0].reason) || r.status); e.status = r.status; throw e; }
    return j;
  }
  async function pollSubs() {
    for (;;) {
      try { const j = await api('channels', { part: 'statistics', id: CHANNEL }); const n = +j.items[0].statistics.subscriberCount; if (n) setSubs(n); }
      catch (e) { status('subs: ' + e.message); }
      await sleep(90000);
    }
  }
  async function findLiveChat() {
    if (P.get('v')) {
      const j = await api('videos', { part: 'liveStreamingDetails', id: P.get('v') });
      return j.items[0] && j.items[0].liveStreamingDetails && j.items[0].liveStreamingDetails.activeLiveChatId;
    }
    const uploads = 'UU' + CHANNEL.slice(2);
    const pl = await api('playlistItems', { part: 'contentDetails', playlistId: uploads, maxResults: 25 });
    const ids = pl.items.map(i => i.contentDetails.videoId).join(',');
    const v = await api('videos', { part: 'liveStreamingDetails', id: ids });
    // Upcoming scheduled streams also have an open chat, so only take one that has actually started and not ended.
    const live = v.items.filter(i => { const d = i.liveStreamingDetails; return d && d.activeLiveChatId && d.actualStartTime && !d.actualEndTime; })
      .sort((a, b) => Date.parse(b.liveStreamingDetails.actualStartTime) - Date.parse(a.liveStreamingDetails.actualStartTime))[0];
    return live && live.liveStreamingDetails.activeLiveChatId;
  }
  async function pollChat() {
    let chatId = null;
    while (!chatId) {
      try { chatId = await findLiveChat(); } catch (e) { status('find: ' + e.message); }
      if (!chatId) { status('waiting for the live stream…'); await sleep(60000); }
    }
    status('chat connected');
    let token = '', first = true, polls = 0, total = 0;
    for (;;) {
      try {
        const j = await api('liveChat/messages', { liveChatId: chatId, part: 'snippet,authorDetails', maxResults: 200, ...(token ? { pageToken: token } : {}) });
        token = j.nextPageToken;
        const items = j.items || [];
        polls++; total += items.length;
        status(`chat ✓ …${chatId.slice(-6)} · poll ${polls} · got ${items.length} (total ${total})` + (items.length ? ` · last: ${(items[items.length - 1].snippet.type || '').replace('Event', '')}` : ''));
        const fresh = first ? items.slice(-3) : items;   // on connect, show only the last 3 without welcomes
        for (const it of fresh) {
          const s = it.snippet, a = it.authorDetails;
          if (s.type !== 'textMessageEvent' && s.type !== 'superChatEvent') continue;
          const m = { id: a.channelId, name: a.displayName, text: s.displayMessage, owner: a.isChatOwner, mod: a.isChatModerator };
          try {
            if (first) { seen.add(m.id); if (!(m.owner || m.mod) || !m.text.startsWith('!')) chatLine(m.name, m.text, m.owner ? 'owner' : m.mod ? 'mod' : ''); }
            else handle(m);
          } catch (err) { status('render error: ' + err.message); }
        }
        if (first) { items.forEach(it => seen.add(it.authorDetails.channelId)); store.set('ls_seen', [...seen].slice(-5000)); first = false; }
        await sleep(Math.max(+j.pollingIntervalMillis || 0, 9000));   // ≥9 s keeps a 3–4 h stream inside the free daily quota
      } catch (e) {
        status('chat: ' + e.message);
        if (/liveChatEnded|liveChatNotFound|forbidden/i.test(e.message)) { await sleep(60000); return pollChat(); }
        await sleep(20000);
      }
    }
  }

  /* ---------- demo mode (no key needed) ---------- */
  async function demo() {
    status('DEMO MODE');
    subs = subs || 202; drawGoal();
    const fake = [['Arjun_K', 'bro which build for kongming?'], ['Nikhil 07', 'hii sensei 👋'], ['Rahul.mallu', 'jungle path kaanikku'], ['Fathima', '1'], ['Akhil', 'nice gank 🔥']];
    let i = 0;
    const tick = () => { const [n, t] = fake[i++ % fake.length]; handle({ id: 'demo' + (i % 7), name: n, text: t }); };
    tick(); setInterval(tick, 4000);
    setTimeout(() => handle({ id: 'own', name: 'Liebe Sensei', text: '!predict 40', owner: true }), 6000);
    setInterval(() => { if (pred.open) for (let k = 0; k < 2; k++) vote('v' + Math.random(), Math.random() > .35); }, 1500);
    if (P.get('demo') === '1') setTimeout(() => handle({ id: 'own', name: 'Liebe Sensei', text: '!win', owner: true }), 30000);
    setTimeout(() => setSubs(subs + 1), 12000);
  }

  if (DEMO) { window.__handle = handle; demo(); }   // demo only: tests can send chat lines with window.__handle({...})
  else if (!KEY) status('Add ?k=YOUR_API_KEY to the URL');
  else { pollSubs(); pollChat(); }
})();
</script>
